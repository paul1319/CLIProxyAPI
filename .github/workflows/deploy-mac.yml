name: deploy-mac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mac
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'paul1319/CLIProxyAPI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/paul1319/cliproxyapi@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate deployment scripts
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/ssh-confirm.sh
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Test and build (excluding the live LAN multicast probe)
        run: |
          # This existing integration test requires working LAN multicast discovery.
          go test -skip '^TestAdvertiserAndBrowser_Integration$' ./...
          go build -o test-output ./cmd/server
          rm test-output
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/paul1319/cliproxyapi:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=sha-${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.CLI_PROXY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      DEPLOY_HOST: ${{ vars.CLI_PROXY_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.CLI_PROXY_DEPLOY_USER }}
      IMAGE: ${{ needs.publish.outputs.image }}
      RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate deployment settings
        env:
          TS_CLIENT_ID: ${{ vars.TS_CLIENT_ID }}
          TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
        run: |
          [[ -n "$TS_CLIENT_ID" && -n "$TS_AUDIENCE" ]] || { echo 'Configure TS_CLIENT_ID and TS_AUDIENCE'; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Invalid CLI_PROXY_DEPLOY_HOST'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid CLI_PROXY_DEPLOY_USER'; exit 1; }
          [[ "$IMAGE" =~ ^ghcr.io/paul1319/cliproxyapi@sha256:[a-f0-9]{64}$ ]] || exit 1
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:cliproxy-ci
          hostname: cliproxy-ci-${{ github.run_id }}-${{ github.run_attempt }}
          ping: ${{ vars.CLI_PROXY_DEPLOY_HOST }}
      - name: Install versioned deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -C deploy -czf - compose.yaml deploy.sh | bash deploy/ssh-confirm.sh \
            "Installed deployment bundle $RELEASE" "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; mkdir -p \"\$HOME/.local/share/cliproxyapi/releases\" && mkdir \"\$HOME/.local/share/cliproxyapi/releases/$RELEASE\" && tar -xzf - -C \"\$HOME/.local/share/cliproxyapi/releases/$RELEASE\" && printf '%s\\n' 'Installed deployment bundle $RELEASE'"
      - name: Deploy and check HTTP health, rolling back on failure
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | bash deploy/ssh-confirm.sh \
            "Deployed $IMAGE (bundle $RELEASE); HTTP health check passed." "$DEPLOY_USER@$DEPLOY_HOST" \
            "PATH=/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin /bin/bash \"\$HOME/.local/share/cliproxyapi/releases/$RELEASE/deploy.sh\" '$IMAGE' --registry-token-stdin '$REGISTRY_USER'"
