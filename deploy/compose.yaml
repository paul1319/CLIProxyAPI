services:
  proxy:
    image: ${CLI_PROXY_IMAGE:?Set CLI_PROXY_IMAGE to an immutable image reference}
    platform: linux/amd64
    user: "1000:1000"
    init: true
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["./CLIProxyAPI", "--config", "/config/config.yaml"]
    environment:
      TZ: Europe/Vienna
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/static
      MANAGEMENT_DISABLE_AUTO_UPDATE: "true"
      CLI_PROXY_STATE_DIR: /data/state
    ports:
      - "127.0.0.1:8317:8317"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - type: bind
        source: ./state
        target: /data/state
        bind:
          create_host_path: false
      - type: bind
        source: ./config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ./auths
        target: /root/.cli-proxy-api
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /CLIProxyAPI/logs
        bind:
          create_host_path: false
      - type: bind
        source: ./plugins
        target: /CLIProxyAPI/plugins
        bind:
          create_host_path: false
      - type: bind
        source: ./static
        target: /data/static
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
